name = "hiba-contact-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Non-secret configuration — safe to commit.
# ALLOWED_ORIGINS: comma-separated list of sites permitted to call this Worker.
[vars]
SANITY_PROJECT_ID = "7rufe5dw"
SANITY_DATASET = "production"
ALLOWED_ORIGINS = "https://naubhar46-max.github.io,https://hiba-muzammil-qadri-website.vercel.app,http://localhost:8123"

# Workers KV namespace used for basic per-IP rate limiting.
# Create it with: npx wrangler kv namespace create RATE_LIMIT_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "8b9e997318b94f43a4cda5c4d3c628b0"

# SANITY_WRITE_TOKEN is set as a secret, never in this file:
#   npx wrangler secret put SANITY_WRITE_TOKEN
# (or via the Cloudflare dashboard: Workers & Pages → this worker →
# Settings → Variables → Add secret)
